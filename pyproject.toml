[project]
name = "le-analyst"
version = "0.1.0"
description = "Research assistant for public equities"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "typer>=0.12.0",
    "tavily-python>=0.5.0",
    "trafilatura>=1.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
analyst = "analyst:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["analyst"]
